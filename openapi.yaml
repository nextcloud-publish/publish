openapi: 3.1.0

info:
  title: publish API
  version: main
  summary: Stores static sites and queues their builds for publish-worker.
  description: |
    `POST /static-sites` creates a static site and queues its first build. publish-worker renders
    the site and reports the outcome with a `PATCH` to the request's `callback_status_url`, described
    under the `buildStatus` callback of `POST /static-sites`.
  license:
    name: AGPL-3.0-or-later
    identifier: AGPL-3.0-or-later

servers:
  - url: https://publish.example.org
    description: A deployment; every operator runs their own.

tags:
  - name: Static sites
    description: Static sites, their builds and the status callback.
  - name: Health
    description: |
      `/health` is for container healthchecks and uptime monitoring, without a token.
      `/auth-verification` is for clients testing the URL and API token.

paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Health check
      description: |
        Public, for container healthchecks and uptime monitoring. Not a token test: an
        `Authorization` header is ignored; use `/auth-verification` for that.
      security: []
      responses:
        '200':
          description: The app is up. It does not check the broker.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
    head:
      tags: [Health]
      operationId: headHealth
      summary: Health check without a body
      description: |
        `GET /health` for monitors that send `HEAD`: public, the same status code, no body.
        Not a token test; use `/auth-verification` for that.
      security: []
      responses:
        '200':
          description: The app is up. It does not check the broker.

  /auth-verification:
    get:
      tags: [Health]
      operationId: verifyAuth
      summary: Auth verification
      description: |
        For clients such as Collectives to test the URL and API token before sending builds.
        Same answer as `/health`, but only with a valid bearer token. Not for monitoring, since
        it needs the token.
      responses:
        '200':
          description: The app is up and accepted the token. It does not check the broker.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /static-sites:
    post:
      tags: [Static sites]
      operationId: createStaticSite
      summary: Create a static site and queue its first build
      description: |
        Stores the site and answers `202` only after the broker confirms the build. Only creates:
        an id or a slug that is already stored is a `409`, and nothing is stored or queued.
        The fields travel under `data`; other fields, inside or outside it, are ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '#/components/schemas/StaticSiteRequest'
      responses:
        '202':
          $ref: '#/components/responses/Enqueued'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: |
            A site with this `static_site_id` is already stored, or another site holds the `slug`.
            Nothing was stored or queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conflict'
        '503':
          $ref: '#/components/responses/NotEnqueued'
      callbacks:
        buildStatus:
          '{$request.body#/data/callback_status_url}':
            patch:
              summary: Report the outcome of an operation
              description: |
                publish-worker sends this once a create or update is published, once a delete is
                done, or once any of them failed for good. Delivery is at-least-once: dedupe on
                `(callback_status_url, status)` and treat a status as final.

                Before `failed` is sent for a create, the build leaves nothing behind: its published
                site and its `static_site` entry are removed, and the client can POST the site again
                with a new `build_id`. Only if publish-worker cannot reach the database does the
                entry stay; the new POST then gets a `409` until an operator removes it. A failed
                update or delete keeps the published site, and the entry stays as `failed`.
              security: []
              parameters:
                - name: OCS-APIRequest
                  in: header
                  required: true
                  description: Lets the call pass Nextcloud's CSRF check without a login.
                  schema:
                    const: 'true'
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      oneOf:
                        - $ref: '#/components/schemas/BuildPublished'
                        - $ref: '#/components/schemas/SiteDeleted'
                        - $ref: '#/components/schemas/BuildFailed'
              responses:
                '2XX':
                  description: Accepted.
                '3XX':
                  description: Not followed. The build is reported `failed` and not retried.
                '4XX':
                  description: |
                    `408` and `429` are retried, so the whole build runs again. Any other `4XX`
                    fails the build for good.
                '5XX':
                  description: Retried, so the whole build runs again.

  /static-sites/slug-available:
    post:
      tags: [Static sites]
      operationId: checkSlugAvailable
      summary: Check whether a slug is free
      description: |
        A slug is free when no stored site holds it, whatever that site's status. The answer can
        be outdated by the time of the create, which then answers `409 slug already taken`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: object
                  required: [slug]
                  properties:
                    slug:
                      $ref: '#/components/schemas/StaticSiteRequest/properties/slug'
      responses:
        '200':
          description: Whether the slug is free.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [available]
                    properties:
                      available:
                        type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: The database could not be reached.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [error_message]
                    properties:
                      error_message:
                        enum: ['could not check slug']

  /static-sites/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The site's `static_site_id`, in lower case. Anything else is a `404`.
        schema:
          type: string
          format: uuid
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    patch:
      tags: [Static sites]
      operationId: updateStaticSite
      summary: Rebuild a static site from new content
      description: |
        Marks the site `pending` with the new `build_id` and queues its build; the published site
        stays until the new one replaces it, under the same `slug`. One operation per site: while the last
        one is pending the answer is `409`, unless it has been pending for longer than
        `PENDING_TIMEOUT_SECONDS`. The callback reports the outcome, as for a create.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '#/components/schemas/StaticSiteUpdateRequest'
      responses:
        '202':
          $ref: '#/components/responses/Enqueued'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The site's last operation is still pending, or the `build_id` does not sort after the
            stored one. Nothing was changed or queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conflict'
        '503':
          $ref: '#/components/responses/NotEnqueued'
    delete:
      tags: [Static sites]
      operationId: deleteStaticSite
      summary: Remove a static site
      description: |
        Marks the site `pending` and queues its removal; the site keeps its stored `build_id`.
        publish-worker removes the published site, then the entry, then reports `deleted` to
        `callback_status_url`. One operation per site, as for an update.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '#/components/schemas/StaticSiteDeleteRequest'
      responses:
        '202':
          $ref: '#/components/responses/Enqueued'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The site's last operation is still pending. Nothing was changed or queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conflict'
        '503':
          $ref: '#/components/responses/NotEnqueued'

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: |
        The deployment's `PUBLISH_API_TOKEN`. The scheme is case-sensitive (`Bearer`), and the
        token may use `A-Z a-z 0-9 - _ + ~ / .` with optional trailing `=`.

  responses:
    Enqueued:
      description: Queued. The answer has no body.

    BadRequest:
      description: A field is missing or invalid, or the body is not valid JSON.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Invalid'

    NotFound:
      description: No site has this id.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: object
                required: [error_message]
                properties:
                  error_message:
                    enum: ['static site not found']

    NotEnqueued:
      description: |
        The database or the broker failed, or the broker did not confirm the message. The site is
        left as it was before the request, and nothing was queued.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: object
                required: [error_message]
                properties:
                  error_message:
                    enum: ['could not enqueue build']

    Unauthorized:
      description: |
        No token, or a token that does not match. Rely on the status code: without a token the
        body is Symfony's error, `Problem` when the request accepts JSON and an HTML page
        otherwise; a wrong token gets an empty body and a `WWW-Authenticate` header.
      headers:
        WWW-Authenticate:
          description: Only for a token that parsed but did not match.
          schema:
            type: string
            examples:
              - Bearer error="invalid_token",error_description="Invalid credentials."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
        text/html: {}

  schemas:
    Ok:
      type: object
      required: [status]
      properties:
        status:
          enum: ['ok']

    SafeId:
      type: string
      pattern: '^[A-Za-z0-9_-]{1,128}$'

    HttpUrl:
      type: string
      format: uri
      pattern: '^[Hh][Tt][Tt][Pp][Ss]?://[^/?#]+'
      description: An `http` or `https` URL with a host.

    StaticSiteRequest:
      type: object
      required: [static_site_id, build_id, slug, title, content_download_url, callback_status_url]
      properties:
        static_site_id:
          type: string
          format: uuid
          pattern: '^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-7[0-9A-Fa-f]{3}-[89ABab][0-9A-Fa-f]{3}-[0-9A-Fa-f]{12}$'
          description: |
            Identifies the site; a UUIDv7 chosen by the client. Stored and used in lower case.
          examples: ['0192f3c4-7b1e-7a3e-9f4c-2d5e8a1b6c70']
        build_id:
          type: string
          format: uuid
          pattern: '^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-7[0-9A-Fa-f]{3}-[89ABab][0-9A-Fa-f]{3}-[0-9A-Fa-f]{12}$'
          description: |
            Identifies this build; a UUIDv7 chosen by the client. Stored as the site's last build and
            used in lower case, also as the build's directory in publish-worker.
          examples: ['0199a1b2-3c4d-7e5f-8a9b-0c1d2e3f4a5b']
        slug:
          allOf: [$ref: '#/components/schemas/SafeId']
          description: |
            The directory the site is published under, and its URL path. Unique across all sites.
          examples: [some_collective]
        title:
          type: string
          pattern: '\S'
          maxLength: 200
          description: The heading on every page. Trimmed; 1 to 200 characters after trimming.
          examples: [Some Collective]
        content_download_url:
          allOf: [$ref: '#/components/schemas/HttpUrl']
          description: The Collectives export (`.tar.gz`) publish-worker downloads.
          examples: ['https://cloud.example.org/apps/collectives/publish/0192f3c4-7b1e-7a3e-9f4c-2d5e8a1b6c70/content.tar.gz']
        callback_status_url:
          allOf: [$ref: '#/components/schemas/HttpUrl']
          description: Where publish-worker `PATCH`es the outcome; see the `buildStatus` callback.
          examples: ['https://cloud.example.org/apps/collectives/publish/0192f3c4-7b1e-7a3e-9f4c-2d5e8a1b6c70/status']
        render_options:
          description: |
            Any JSON value, passed unchecked to ssg-library, which validates it; see its
            [render options](https://github.com/nextcloud-publish/ssg-library#render-options).
            An invalid value is not a `400`: the build ends with a `failed` callback.
          examples: [{ theme: topnav }]

    StaticSiteUpdateRequest:
      type: object
      required: [build_id, title, content_download_url, callback_status_url]
      properties:
        build_id:
          $ref: '#/components/schemas/StaticSiteRequest/properties/build_id'
        title:
          $ref: '#/components/schemas/StaticSiteRequest/properties/title'
        content_download_url:
          $ref: '#/components/schemas/StaticSiteRequest/properties/content_download_url'
        callback_status_url:
          $ref: '#/components/schemas/StaticSiteRequest/properties/callback_status_url'
        render_options:
          $ref: '#/components/schemas/StaticSiteRequest/properties/render_options'

    StaticSiteDeleteRequest:
      type: object
      required: [callback_status_url]
      properties:
        callback_status_url:
          $ref: '#/components/schemas/StaticSiteRequest/properties/callback_status_url'

    Invalid:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [error_message]
          properties:
            error_message:
              type: string
              description: Which check failed.
              examples: ['slug must match [A-Za-z0-9_-]{1,128}']

    Conflict:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [error_message]
          properties:
            error_message:
              enum: ['static site already exists', 'slug already taken', 'operation in progress', 'build_id not newer']

    Problem:
      type: object
      description: Symfony's error, in the shape of RFC 9457.
      required: [title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string

    BuildPublished:
      type: object
      required: [status, data]
      properties:
        status:
          enum: ['published']
        data:
          type: object
          required: [publish_url]
          properties:
            publish_url:
              type: string
              format: uri
              examples: ['https://sites.example.org/some_collective/']

    SiteDeleted:
      type: object
      required: [status, data]
      properties:
        status:
          enum: ['deleted']
        data:
          type: object
          maxProperties: 0

    BuildFailed:
      type: object
      required: [status, data]
      properties:
        status:
          enum: ['failed']
        data:
          type: object
          required: [error_message]
          properties:
            error_message:
              type: string
              maxLength: 515
              description: |
                Why the build failed. Paths are shortened, URL credentials removed, and the text
                cut at 500 characters plus ` ...(truncated)`.
              examples: ['Invalid Collectives export: no Markdown page found']

security:
  - bearer: []
