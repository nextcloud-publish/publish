name: publish-fpm

# Production sample with PHP-FPM behind nginx, set up by
# https://github.com/nextcloud-publish/publish/wiki/Deploy-publish
# A reverse proxy on the host terminates TLS and forwards to 127.0.0.1:${PUBLISH_PORT}.

services:
  web:
    image: nginxinc/nginx-unprivileged:1.30-alpine
    environment:
      TZ: "${TZ:-Europe/Berlin}"
    ports:
      - "127.0.0.1:${PUBLISH_PORT:-8080}:8080"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - publish
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  publish:
    image: ${PUBLISH_IMAGE:-ghcr.io/nextcloud-publish/publish:latest}
    environment:
      TZ: "${TZ:-Europe/Berlin}"
      AMQP_DSN: "amqp://publish:${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}@rabbitmq:5672/%2f"
      # Must match `heartbeat` in rabbitmq/rabbitmq.conf.
      AMQP_HEARTBEAT: "60"
      PUBLISH_API_TOKEN: "${PUBLISH_API_TOKEN:?set PUBLISH_API_TOKEN in .env}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      SENTRY_DSN: "${PUBLISH_SENTRY_DSN:-}"
      DATABASE_URL: "postgresql://publish:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/publish?serverVersion=18&charset=utf8"
    volumes:
      - ./logs/publish:/publish/var/log
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      TZ: "${TZ:-Europe/Berlin}"
      POSTGRES_USER: publish
      POSTGRES_DB: publish
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
    volumes:
      # Postgres 18 images keep their data under /var/lib/postgresql/<major>/,
      # so the volume goes on the parent directory, not on .../data.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U publish -d publish"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4
    hostname: rabbitmq
    environment:
      TZ: "${TZ:-Europe/Berlin}"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-custom.conf:ro
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running && rabbitmqctl list_exchanges --quiet --no-table-headers name | grep -qx delays"]
      interval: 10s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  ssg-worker:
    image: ${SSG_WORKER_IMAGE:-ghcr.io/nextcloud-publish/ssg-worker:latest}
    deploy:
      replicas: ${SSG_WORKER_REPLICAS:-2}
    environment:
      TZ: "${TZ:-Europe/Berlin}"
      AMQP_DSN: "amqp://publish:${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}@rabbitmq:5672/%2f"
      # Must match `heartbeat` in rabbitmq/rabbitmq.conf.
      AMQP_HEARTBEAT: "60"
      PUBLISH_BASE_URL: "${PUBLISH_BASE_URL:?set PUBLISH_BASE_URL in .env}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      SENTRY_DSN: "${SSG_WORKER_SENTRY_DSN:-}"
    volumes:
      - build-temp:/ssg-worker/var/build_temp
      - ./pages:/ssg-worker/var/published
      - ./logs/ssg-worker:/ssg-worker/var/log
    depends_on:
      rabbitmq:
        condition: service_healthy
    # Required: the image's CMD exits the worker after an hour (--time-limit=3600).
    restart: unless-stopped

volumes:
  rabbitmq-data:
  postgres-data:
  build-temp:
