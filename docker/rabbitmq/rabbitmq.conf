# Mounted at /etc/rabbitmq/conf.d/20-custom.conf. docker/dev/rabbitmq/rabbitmq.conf
# explains each setting; these are the production values.

# A whole build runs before the ack, so this must stay well above the longest realistic build.
consumer_timeout = 300000

# Must match AMQP_HEARTBEAT in compose.yaml.
heartbeat = 60

vm_memory_high_watermark.relative = 0.6
disk_free_limit.absolute = 1GB

load_definitions = /etc/rabbitmq/definitions.json

log.console = true
log.console.level = info
