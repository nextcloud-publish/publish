# RabbitMQ configuration for the publish service (development).
# Mounted at /etc/rabbitmq/conf.d/20-custom.conf (read-only).
#
# These are FAST development values, deliberately shrunk so the timeout
# hierarchy fires in seconds instead of minutes. Production values are noted
# alongside each one.
#
#   heartbeat 10s  <<  consumer_timeout 30s
#   (prod:    60s)     (prod:          300s)
#
# The ordering is the whole point: a stuck worker must lose its connection well
# before the broker gives up waiting for the ack, so each recovery mechanism
# gets a clear window instead of firing at the same moment.

# --- Ack deadline -----------------------------------------------------------
# Maximum time a worker may hold an unacked message before the broker closes
# the channel and requeues it. This is what recovers a worker that is wedged
# but still answering heartbeats. Dev: 30s. Production: 300000 (5m).
consumer_timeout = 30000

# --- Connection liveness ----------------------------------------------------
# The broker closes a connection after two missed heartbeats (~20s here). A
# single-threaded worker blocked in a build sends none at all unless it emits
# them from a signal handler. Dev: 10s. Production: 60.
heartbeat = 10

# --- Resource alarms --------------------------------------------------------
# When crossed, publishers are BLOCKED (not errored). Diagnose with
# `rabbitmq-diagnostics alarms`.
vm_memory_high_watermark.relative = 0.6
disk_free_limit.absolute = 100MB

# --- Topology definitions ---------------------------------------------------
# Import the vhost, user, permissions and queues from a definitions file at
# boot. This makes the BROKER the single source of truth for topology; the
# application must never declare any of it itself.
#
# Because this file defines the `app` user, the RABBITMQ_DEFAULT_USER/PASS env
# vars are ignored (a node that imports users skips default-user creation), so
# they have been removed from compose.dev.yaml. The password_hash in the file
# is a salted SHA-256 of "secret"; regenerate with:
#   php -r '$s=random_bytes(4);echo base64_encode($s.hash("sha256",$s."<pw>",true));'
load_definitions = /etc/rabbitmq/definitions.json

# --- Management UI ----------------------------------------------------------
management.tcp.ip = 0.0.0.0
management.rates_mode = basic

# --- Logging ----------------------------------------------------------------
log.console = true
log.console.level = info
