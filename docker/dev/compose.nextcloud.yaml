# Joins nginx-fpm-gateway and ssg-worker to the network of nextcloud-docker-dev. ssg-worker downloads the content
# from Nextcloud and reports the build status to it; collectives-api-mock still serves :8081.
# See docs/wiki/Develop-publish-with-nextcloud-docker-dev.md.
#
# 1. Start nextcloud-docker-dev, which creates the network, from its directory:
#      docker compose up -d nextcloud
# 2. Start this stack from publish/:
#      docker compose -f docker/dev/compose.yaml -f docker/dev/compose.nextcloud.yaml up -d --build

services:
  nginx-fpm-gateway:
    networks:
      default:
      # Collectives reaches the API at http://publish.local:8080.
      nextcloud:
        aliases:
          - publish.local

  ssg-worker:
    networks:
      default:
      # nextcloud.local is the nextcloud-docker-dev proxy on this network.
      nextcloud:

networks:
  # nextcloud-docker-dev's default network, <its COMPOSE_PROJECT_NAME>_default.
  nextcloud:
    external: true
    name: ${NEXTCLOUD_NETWORK:-master_default}
