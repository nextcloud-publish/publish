# Two unrelated jobs in one container, kept on separate ports so neither
# pretends to be the other.

# :80 -- the Nextcloud Collectives content API stand-in. ssg-worker fetches
# `content_download_url` from here.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # The archives are generated at image build time (see Dockerfile), not
    # committed. Serve them as-is; ContentDownloader only cares about the
    # status code and the body.
    location / {
        autoindex on;
        default_type application/gzip;
    }
}

# :8081 -- serves PUBLISHED_DIR read-only.
#
# Serving published sites is NOT this service's job in production; this block
# exists so the dev stack can prove two things that no unit test can reach:
# that the promoted directory is actually readable by another uid (ssg-worker
# creates output/ at 0750 as root, so an un-chmod'd promotion 403s here), and
# that a republish really replaced the tree instead of merging into it.
server {
    listen 8081;
    server_name _;

    root /opt/ssg/published;
    autoindex on;

    # The promoter stages builds in PUBLISHED_DIR/.staging so the final swap is
    # a same-mount rename. Nothing under a dotfile is ever meant to be served,
    # and a half-promoted build must never be reachable.
    location ~ /\. {
        return 404;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}
