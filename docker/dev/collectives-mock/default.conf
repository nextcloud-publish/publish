# Three unrelated jobs in one container, kept on separate ports so none
# pretends to be another.

# The callback sink below is the only place a build's outcome is visible, so
# the body has to be in the log line -- the status and the error are the whole
# point of the exercise.
log_format callback '$time_iso8601 CALLBACK $request_method $uri -> $status body=$request_body';

# :80 -- the Nextcloud Collectives content API stand-in. ssg-worker fetches
# `content_download_url` from here.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # The archives are generated at image build time (see Dockerfile), not
    # committed. Serve them as-is; ContentDownloader only cares about the
    # status code and the body.
    location / {
        autoindex on;
        default_type application/gzip;
    }
}

# :8081 -- serves PUBLISHED_DIR read-only.
#
# Serving published sites is NOT this service's job in production -- an
# external nginx does that. This block exists so the dev stack can prove two
# things no unit test can reach: that the promoted directory is actually
# readable by another uid (the worker creates output/ at 0750 as root, so an
# un-chmod'd promotion 403s here, and nginx workers run as uid 101), and that a
# republish really replaced the tree instead of merging into it.
server {
    listen 8081;
    server_name _;

    root /opt/ssg/published;
    autoindex on;

    # The promoter stages builds in PUBLISHED_DIR/.staging so the final swap is
    # a same-mount rename. Nothing under a dotfile is ever meant to be served,
    # and a half-promoted build must never be reachable.
    location ~ /\. {
        return 404;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}

# :8083 -- stands in for the Nextcloud endpoint at `callback_status_url`.
#
# Exists so the build outcome is OBSERVABLE. Reporting success or failure is
# what this whole retry design is for, and nothing else in the stack
# shows whether it happened, what status was sent, or how many times.
#
# Read it with: docker compose -f docker/dev/compose.yaml logs collectives-mock
server {
    listen 8083;
    server_name _;

    access_log /dev/stdout callback;

    location / {
        # Outcome payloads are small; anything larger is a bug worth seeing
        # rather than silently truncating.
        client_body_buffer_size 64k;
        client_max_body_size 64k;

        # NOT `return 204` here. nginx never reads the request body for a
        # location that short-circuits, so $request_body would always be empty
        # and the log line would be useless. Proxying forces the read.
        proxy_pass http://127.0.0.1:8084;
    }
}

# The sink's actual responder, loopback-only so nothing outside the container
# can reach it directly.
server {
    listen 127.0.0.1:8084;
    server_name _;

    location / {
        return 204;
    }
}
