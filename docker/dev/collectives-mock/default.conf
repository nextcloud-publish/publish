# Two servers in one container:
#   8081  serves the published sites
#   8082  Nextcloud Collectives API: /content/ archives and /status/ callbacks

# Logs the request body, because it carries the build status and result sent by the callback.
log_format callback escape=none '$time_iso8601 CALLBACK $request_method $uri -> $status body=$request_body';

# :8081 -- serves PUBLISHED_DIR read-only.
#
# In production an external nginx serves the published sites.
server {
    listen 8081;
    server_name _;

    root /opt/ssg/published;
    autoindex on;

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}

# :8082 -- replaces the Nextcloud Collectives API.
#   /content/  content archives, downloaded by ssg-worker from `content_download_url`
#   /status/   status callbacks, sent by ssg-worker to `callback_status_url`
server {
    listen 8082;
    server_name _;

    # The archives are built by the Dockerfile.
    # ContentDownloader reads only the status code and the body.
    location /content/ {
        alias /usr/share/nginx/html/;
        autoindex on;
        default_type application/gzip;
    }

    # Logs every request to the status callback endpoint.
    # Read it with: docker compose -f docker/dev/compose.yaml logs collectives-mock
    location /status/ {
        access_log /dev/stdout callback;


        # nginx does not read the request body for a location that only returns,
        # so `return 204` here would leave $request_body empty. Proxying makes nginx read it.
        proxy_pass http://127.0.0.1:8083;
    }
}

# Answers the proxied callbacks. Listens on loopback only, so it is not reachable from outside the container.
server {
    listen 127.0.0.1:8083;
    server_name _;

    # The CALLBACK line on :8082 already logs each callback.
    access_log off;

    location / {
        return 204;
    }
}
