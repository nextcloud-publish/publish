# RabbitMQ configuration for the publish service (development).
# Mounted at /etc/rabbitmq/conf.d/20-custom.conf (read-only).
#
# The timeouts are shorter than in production, so failures show up quickly while developing:
#
#   setting            dev     prod
#   heartbeat          10s     60s
#   consumer_timeout   120s    300s
#
# heartbeat must stay well below consumer_timeout,
# so a worker that has stopped responding loses its connection before the broker gives up waiting for its ack.

# --- Ack deadline -----------------------------------------------------------
# Maximum time a worker may hold a message without acking it.
# After that the broker closes the channel and requeues the message.
# This recovers a worker that is stuck but still sends heartbeats.
#
# A whole build (download, extract, render, publish) runs before the ack, so this must stay well above a realistic build.
# A build that runs longer is redelivered, and RejectRedeliveredMessageMiddleware rejects the redelivery before the handler runs.
# Each rejection uses up one of the build's two attempts, so a slow build is reported as failed without having failed.
consumer_timeout = 120000

# --- Connection liveness ----------------------------------------------------
# In seconds. The broker closes a connection after two missed heartbeats (~20s here).
# The worker is single-threaded: while a build runs, it sends heartbeats only from a signal handler.
# Must match AMQP_HEARTBEAT in docker/dev/compose.yaml.
heartbeat = 10

# --- Resource alarms --------------------------------------------------------
# Above 60% of the memory RabbitMQ detects (the container limit, or the host's RAM without one), or below 100MB free disk, the broker blocks publishers until the alarm clears.
# Publishers wait, they do not get an error. Check with `rabbitmq-diagnostics alarms`.
vm_memory_high_watermark.relative = 0.6
disk_free_limit.absolute = 100MB

# --- Topology definitions ---------------------------------------------------
# Imports the vhost, user, permissions, exchanges and queues from definitions.json at boot.
# See README.md in this directory for the topology and how to change it.
load_definitions = /etc/rabbitmq/definitions.json

# --- Management UI ----------------------------------------------------------
# Listens on all interfaces inside the container; compose.yaml publishes the port on 127.0.0.1 only.
management.tcp.ip = 0.0.0.0
management.rates_mode = basic

# --- Logging ----------------------------------------------------------------
log.console = true
log.console.level = info
