name: publish-dev

# Full dev stack. Needs both repos cloned side by side:
#
#   <any dir>/
#   ├── publish/          this repo, run compose from here
#   └── publish-worker/   built and mounted from ../../../publish-worker
#
#   docker network create collectives-dev
#   docker compose -f docker/dev/compose.yaml up --build
#
# Reads docker/dev/.env, created from .env.example, for host ids other than 1000.

services:
  nginx-fpm-gateway:
    image: nginxinc/nginx-unprivileged:1.30-alpine
    environment:
      TZ: "${TZ:-Europe/Berlin}"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - publish
    networks:
      default:
      # Nextcloud from nextcloud-docker-dev reaches the API at http://publish.local:8080.
      collectives-dev:
        aliases:
          - publish.local

  publish:
    build:
      context: ../..
      dockerfile: docker/dev/Dockerfile
      pull: true
    image: publish-dev
    user: "${PUBLISH_UID:-1000}:${PUBLISH_GID:-1000}"
    environment:
      TZ: "${TZ:-Europe/Berlin}"
      APP_ENV: dev
      APP_DEBUG: "1"
      AMQP_DSN: "amqp://publish:secret@rabbitmq:5672/%2f"
      AMQP_HEARTBEAT: "10"
      PUBLISH_API_TOKEN: "dev-api-token-0123456789"
      DATABASE_URL: "postgresql://publish:secret@postgres:5432/publish?serverVersion=${POSTGRES_VERSION:-18}&charset=utf8"
    volumes:
      - ../..:/publish
      - /publish/vendor
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:${POSTGRES_VERSION:-18}-alpine
    environment:
      TZ: "${TZ:-Europe/Berlin}"
      POSTGRES_USER: publish
      POSTGRES_DB: publish
      POSTGRES_PASSWORD: secret
    volumes:
      # Postgres 18 and later images keep their data under /var/lib/postgresql/<major>/,
      # so the volume goes on the parent directory, not on .../data.
      - postgres-data:/var/lib/postgresql
    # For bin/console, PHPUnit and the pre-commit hook on the host; .env and .env.test point there.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      # Over TCP: during the first init the server listens only on its socket.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U publish -d publish"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management
    hostname: rabbitmq
    environment:
      TZ: "${TZ:-Europe/Berlin}"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-custom.conf:ro
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    ports:
      - "127.0.0.1:5672:5672"     # AMQP
      - "127.0.0.1:15672:15672"   # management UI
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running && rabbitmqctl list_exchanges --quiet --no-table-headers name | grep -qx delays"]
      interval: 5s
      timeout: 10s
      retries: 20

  # Consumes q.builds, renders the site into pages/, reports via callback_status_url.
  publish-worker:
    build:
      context: ../../../publish-worker
      dockerfile: docker/dev/Dockerfile
      pull: true
    image: publish-worker-dev
    deploy:
      replicas: 2
    user: "${PUBLISH_WORKER_UID:-1000}:${PUBLISH_WORKER_GID:-1000}"
    environment:
      TZ: "${TZ:-Europe/Berlin}"
      APP_ENV: dev
      APP_DEBUG: "1"
      AMQP_DSN: "amqp://publish:secret@rabbitmq:5672/%2f"
      # Must match `heartbeat` in ./rabbitmq/rabbitmq.conf.
      AMQP_HEARTBEAT: "10"
      # Where collectives-api-mock serves ./pages (:8081); publish_url is built from it.
      PUBLISH_BASE_URL: "http://127.0.0.1:8081"
      # Outside the checkout mounted at /publish-worker: mounted inside it, Docker would create
      # var/ there as root on a fresh clone.
      BUILDS_DIR: /builds
      PAGES_DIR: /pages
      # The same database as publish: the worker sets static_site.status after a build.
      DATABASE_URL: "postgresql://publish:secret@postgres:5432/publish?serverVersion=${POSTGRES_VERSION:-18}&charset=utf8"
    volumes:
      - ../../../publish-worker:/publish-worker
      # Keeps the image's vendor/ visible under the mount above. A host-side
      # `composer require` needs a `docker compose build` to take effect.
      - /publish-worker/vendor
      - ./builds:/builds
      - ./pages:/pages
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    # Mandatory: the image CMD passes --time-limit=3600, so the worker exits hourly.
    restart: unless-stopped
    networks:
      default:
      # nextcloud.local is the nextcloud-docker-dev proxy on this network.
      collectives-dev:

  # Serves published sites read-only (:8081) and replaces the Collectives API (:8082):
  # content archives under /content/, status callbacks under /status/ logged to stdout.
  collectives-api-mock:
    build:
      context: ./collectives-api-mock
    image: collectives-api-mock-dev
    environment:
      TZ: "${TZ:-Europe/Berlin}"
    ports:
      - "127.0.0.1:8081:8081"
      - "127.0.0.1:8082:8082"
    volumes:
      - ./pages:/srv/pages:ro

volumes:
  rabbitmq-data:
  postgres-data:

networks:
  # Shared with nextcloud-docker-dev, created once: docker network create collectives-dev
  collectives-dev:
    external: true
