name: publish-dev

# Full dev stack. Needs both repos cloned side by side:
#
#   <any dir>/
#   ├── publish/      this repo, run compose from here
#   └── ssg-worker/   built and mounted from ../../../ssg-worker
#
#   docker compose -f docker/dev/compose.yaml up --build
#
# Reads docker/dev/.env, created from .env.example, for host ids other than 1000.

services:
  web:
    image: nginxinc/nginx-unprivileged:1.30-alpine
    environment:
      TZ: "${TZ:-Europe/Berlin}"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - publish

  publish:
    build:
      context: ../..
      dockerfile: docker/dev/Dockerfile
      pull: true
    image: publish-dev
    user: "${PUBLISH_UID:-1000}:${PUBLISH_GID:-1000}"
    environment:
      TZ: "${TZ:-Europe/Berlin}"
      APP_ENV: dev
      APP_DEBUG: "1"
      AMQP_DSN: "amqp://publish:secret@rabbitmq:5672/%2f"
      AMQP_HEARTBEAT: "10"
      PUBLISH_API_TOKEN: "dev-api-token-0123456789"
      DATABASE_URL: "postgresql://publish:secret@postgres:5432/publish?serverVersion=18&charset=utf8"
    volumes:
      - ../..:/publish
      - /publish/vendor
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    environment:
      TZ: "${TZ:-Europe/Berlin}"
      POSTGRES_USER: publish
      POSTGRES_DB: publish
      POSTGRES_PASSWORD: secret
    volumes:
      # Postgres 18 images keep their data under /var/lib/postgresql/<major>/,
      # so the volume goes on the parent directory, not on .../data.
      - postgres-data:/var/lib/postgresql
    # No published port on purpose: this database serves the publish container only.
    # bin/console and the tests on the host use a Postgres on the host (see the wiki's
    # Development page), which would collide with a published 5432.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U publish -d publish"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management
    hostname: rabbitmq
    environment:
      TZ: "${TZ:-Europe/Berlin}"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-custom.conf:ro
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    ports:
      - "127.0.0.1:5672:5672"     # AMQP
      - "127.0.0.1:15672:15672"   # management UI
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running && rabbitmqctl list_exchanges --quiet --no-table-headers name | grep -qx delays"]
      interval: 5s
      timeout: 10s
      retries: 20

  # Consumes q.builds, renders the site into published/, reports via callback_status_url.
  ssg-worker:
    build:
      context: ../../../ssg-worker
      dockerfile: docker/dev/Dockerfile
      pull: true
    image: ssg-worker-dev
    deploy:
      replicas: 2
    user: "${SSG_WORKER_UID:-1000}:${SSG_WORKER_GID:-1000}"
    environment:
      TZ: "${TZ:-Europe/Berlin}"
      APP_ENV: dev
      APP_DEBUG: "1"
      AMQP_DSN: "amqp://publish:secret@rabbitmq:5672/%2f"
      # Must match `heartbeat` in ./rabbitmq/rabbitmq.conf.
      AMQP_HEARTBEAT: "10"
      # Where collectives-mock serves ./published (:8081); publish_url is built from it.
      PUBLISH_BASE_URL: "http://127.0.0.1:8081"
    volumes:
      - ../../../ssg-worker:/ssg-worker
      # Keeps the image's vendor/ visible under the mount above. A host-side
      # `composer require` needs a `docker compose build` to take effect.
      - /ssg-worker/vendor
      - ./build_temp:/ssg-worker/var/build_temp
      - ./published:/ssg-worker/var/published
    depends_on:
      rabbitmq:
        condition: service_healthy
    # Mandatory: the image CMD passes --time-limit=3600, so the worker exits hourly.
    restart: unless-stopped

  # Serves published sites read-only (:8081) and replaces the Collectives API (:8082):
  # content archives under /content/, status callbacks under /status/ logged to stdout.
  collectives-mock:
    build:
      context: ./collectives-mock
    image: collectives-mock-dev
    environment:
      TZ: "${TZ:-Europe/Berlin}"
    ports:
      - "127.0.0.1:8081:8081"
      - "127.0.0.1:8082:8082"
    volumes:
      - ./published:/opt/ssg/published:ro

volumes:
  rabbitmq-data:
  postgres-data:
