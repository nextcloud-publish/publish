name: publish-api-dev

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      APP_ENV: dev
      APP_DEBUG: "1"
      AMQP_DSN: "amqp://app:secret@rabbitmq:5672/%2f"
      AMQP_HEARTBEAT: "10"
    ports:
      - "8080:8080"
    volumes:
      - ../:/app
    depends_on:
      - rabbitmq

  rabbitmq:
    image: rabbitmq:4-management
    hostname: rabbitmq
    environment:
      TZ: "${TZ:-Europe/Berlin}"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq-config/rabbitmq.conf:/etc/rabbitmq/conf.d/20-custom.conf:ro
      - ./rabbitmq-config/definitions.json:/etc/rabbitmq/definitions.json:ro
    ports:
      - "127.0.0.1:5672:5672"     # AMQP
      - "127.0.0.1:15672:15672"   # management UI

volumes:
  rabbitmq-data:
