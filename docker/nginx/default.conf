# Mounted as /etc/nginx/conf.d/default.conf. nginx needs no copy of the app:
# public/ holds only the front controller, so every request goes to it.
server {
    listen 8080;
    server_tokens off;
    client_max_body_size 64k;

    location / {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /publish/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /publish/public;
        fastcgi_pass publish:9000;
    }
}
