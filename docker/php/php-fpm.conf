; Replaces /etc/php85/php-fpm.conf: one pool, logs to stderr, runs as the container user.

[global]
error_log = /proc/self/fd/2
log_limit = 8192
daemonize = no

[publish]
listen = 9000

; Without it FPM drops the container's environment: PUBLISH_API_TOKEN and AMQP_DSN would be unset.
clear_env = no

catch_workers_output = yes
decorate_workers_output = no

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
