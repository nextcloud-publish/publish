; Installed as /etc/php85/conf.d/99-publish.ini in the prod and the dev image.

; PHP reads TZ when a process starts; the deployment sets it, UTC otherwise.
date.timezone = ${TZ}

; No X-Powered-By header with the PHP version.
expose_php = Off

; OPcache is built into PHP 8.5. The image sets 0 in prod, where the code only changes with the
; image, and 1 in dev, where the source is mounted.
opcache.validate_timestamps = ${OPCACHE_VALIDATE_TIMESTAMPS}
opcache.revalidate_freq = 0
