# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\Storage\JobLayout:
        arguments:
            # These are three SEPARATE mounts in the dev stack: build temp is a
            # named volume, published and failed are bind mounts under
            # docker/dev so they can be read from the host. rename(2) rejects
            # `old_path.mnt != new_path.mnt` with EXDEV and PHP has no directory
            # fallback, so moves between them copy -- see Filesystem::moveDir().
            # Point them at one mount and the copies become renames for free.
            #
            # JOB_STORAGE_DIR is the same variable ssg-worker reads, and has to
            # name the same directory -- it writes the tree this service
            # promotes. No defaults: a missing value here means builds are
            # looked for somewhere nothing writes, which should fail loudly.
            $buildTempDir: '%env(JOB_STORAGE_DIR)%'
            $publishedDir: '%env(PUBLISHED_DIR)%'
            $failedDir: '%env(FAILED_DIR)%'

    App\Callback\StatusNotifier:
        arguments:
            # SECURITY: callback_status_url comes from the original API caller
            # and is validated nowhere upstream. This decoration is what stops
            # an outbound POST at an internal address, and unlike a check in
            # our own code it also covers redirects and DNS answers.
            $httpClient: '@app.http_client.no_private_network'
            # The POST is the only unbounded part of the handler and the message
            # stays unacked throughout, so the budget has to stay well inside
            # rabbitmq.conf's consumer_timeout (30s dev / 300s prod). Otherwise
            # a slow endpoint becomes a redelivery rather than a retry.
            $timeoutSeconds: 5
            $maxDurationSeconds: 10
            # A status callback that redirects has moved; following it would
            # post a build result somewhere the client never nominated.
            $maxRedirects: 0

    app.http_client.no_private_network:
        class: Symfony\Component\HttpClient\NoPrivateNetworkHttpClient
        arguments: ['@http_client']

    # Explicit instead of #[AsMessageHandler], matching ssg-worker's
    # BuildJobHandler: it pins each handler to the transport it may fire for,
    # and keeps the message-class -> handler link readable here rather than via
    # reflection on __invoke()'s parameter.
    #
    # The second tag on each is not a copy-paste error. HandlersLocator matches
    # on the ReceivedStamp's transport name, which is "build_dead" when a parked
    # message is replayed off the parking queue -- without it that replay throws
    # NoHandlerForMessageException. HandlersLocator dedupes by descriptor, so
    # listing both is safe.
    App\Message\BuildSucceededHandler:
        tags:
            - { name: messenger.message_handler, handles: App\Message\BuildSucceeded, from_transport: build_results }
            - { name: messenger.message_handler, handles: App\Message\BuildSucceeded, from_transport: build_dead }

    App\Message\BuildFailedHandler:
        tags:
            - { name: messenger.message_handler, handles: App\Message\BuildFailed, from_transport: build_failures }
            - { name: messenger.message_handler, handles: App\Message\BuildFailed, from_transport: build_dead }
