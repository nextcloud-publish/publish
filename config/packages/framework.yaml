# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Sessions are disabled: nothing reads or writes one, and the firewall in config/packages/security.yaml is stateless.
    # With sessions on, framework.csrf_protection is enabled automatically, because SecurityBundle installs symfony/security-csrf.
    # A stateful firewall requires sessions, so enable them again if one is added.
    # session: true

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
